# Add this exact location before the generic /vibehard/ location.
# The manager validates both the platform session cookie and the one-time ticket.
location = /vibehard/eda-desktop/ws {
    access_log off;
    proxy_pass http://host.docker.internal:6083/client/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
